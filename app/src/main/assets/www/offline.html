<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Qyriptalk</title>
<style>
  html,body{margin:0;height:100%;background:#05001E;color:#fff;font-family:system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px;margin-bottom:24px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 28px;color:#b9b4d6;font-size:15px;line-height:1.5;max-width:320px}
  button{background:#5E17EB;color:#fff;border:0;border-radius:14px;padding:14px 32px;font-size:16px;font-weight:600}
  button:active{opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <img src="Qyriptalk_Logo.png" alt="">
  <h1>İnternet bağlantısı yok</h1>
  <p>Qyriptalk'ı kullanmak için internete bağlanman gerekiyor. Bağlantı gelince uygulama otomatik açılacak.</p>
  <button onclick="if(window.QyripAndroid){QyripAndroid.retry()}else{location.reload()}">Tekrar dene</button>
</div>
</body>
</html>
